[project]
name = "langchain-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RameshKChoudhary", email = "ramesh2005choudhary@gmail.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "langchain-openrouter>=0.2.9",
    "pip>=26.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain = "langchain:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
[tool.uv]
package = false
